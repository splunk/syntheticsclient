name: Integration Test

# Trusted trigger: runs in the base repo's context (full permissions model below,
# environment secrets available) regardless of whether the triggering PR came from a
# fork. This is the privilege-separated counterpart to pr-metadata.yml, which does the
# untrusted checkout-free bookkeeping.
# See: https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
#
# workflow_run does not automatically attach as a PR status check, so this workflow
# explicitly creates/updates a Check Run on the PR's head SHA via the Checks API — that's
# what branch protection actually watches.
#
# run-name names the PR being tested: without it, every run of this workflow shows as
# "Integration Test" on branch main in the Actions list and in the environment-approval
# prompt, and a reviewer approving the live-token gate can't tell which PR they're
# approving from that alone.
run-name: >-
  Integration Test: ${{ github.event.workflow_run.head_repository.full_name }}@${{ github.event.workflow_run.head_branch }}
  (${{ github.event.workflow_run.head_sha }})

on:
  workflow_run:
    workflows: ["PR Metadata"]
    types: [completed]

permissions: {}

jobs:
  # Ungated on purpose: downloads and validates the pr-metadata artifact immediately,
  # before any approval wait. An environment approval can take up to 30 days (GitHub's own
  # timeout), which would otherwise force the artifact retention window to also cover the
  # entire approval SLA. Resolving here means only this job's (short) runtime needs the
  # artifact to still exist, not however long a reviewer takes to click approve.
  resolve:
    name: resolve
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: write
    outputs:
      found: ${{ steps.pr.outputs.found }}
      number: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.pr.outputs.sha }}
      check-run-id: ${{ steps.create-check.outputs.id }}

    steps:
      - name: Download PR metadata
        id: download
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pr-metadata
          path: pr-metadata
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read and validate PR metadata
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');

            // pr-metadata.yml is a pull_request-triggered workflow, so its *file* can be
            // rewritten by a fork PR to upload arbitrary pr-number/pr-sha content — never
            // trust the artifact as-is. Enforce strict formats and cross-check against
            // fields GitHub itself attaches to this trusted workflow_run event, which a
            // rewritten pr-metadata.yml cannot forge.
            //
            // The job-level guard above (conclusion == 'success') already means a draft
            // PR (whose record-pr job is skipped, reporting conclusion 'skipped') never
            // reaches this job at all. So getting here with a missing or malformed
            // artifact is always an anomaly, not a legitimate "nothing to test" case: fail
            // loudly rather than silently exiting success with no check or comment.
            const rawNumber = fs.readFileSync('pr-metadata/pr-number', 'utf8').trim();
            const rawSha = fs.readFileSync('pr-metadata/pr-sha', 'utf8').trim();

            if (!/^[0-9]+$/.test(rawNumber)) {
              core.setFailed(`pr-metadata artifact has malformed pr-number: ${JSON.stringify(rawNumber)}`);
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(rawSha)) {
              core.setFailed(`pr-metadata artifact has malformed pr-sha: ${JSON.stringify(rawSha)}`);
              return;
            }

            // github.event.workflow_run.head_sha is the commit that triggered the
            // pr-metadata.yml run itself — a value GitHub computes and attaches to the
            // workflow_run event independently of anything pr-metadata.yml's script did.
            // Trust this, not the artifact's own pr-sha file.
            const trustedSha = context.payload.workflow_run.head_sha;
            if (rawSha !== trustedSha) {
              core.setFailed(`pr-metadata artifact sha (${rawSha}) does not match the workflow_run's own head_sha (${trustedSha}) — refusing to trust a forged or stale artifact.`);
              return;
            }

            // Fetch the PR the artifact claims by number, then verify every field that
            // matters against values GitHub itself attached to this trusted workflow_run
            // event — never trust the artifact's number on its own.
            //
            // Deliberately not using listPullRequestsAssociatedWithCommit or the
            // workflow_run payload's own `pull_requests` field: (a) the commit-associated
            // lookup can return multiple open/merged PRs for the same commit (e.g. a
            // commit shared via cherry-pick or a stacked branch), letting a forged
            // artifact redirect handling to an unrelated but-also-matching PR; and (b)
            // workflow_run.pull_requests is documented to come back empty for PRs from
            // forked repositories, which is precisely the case this workflow exists to
            // support. Instead: fetch the claimed PR by number directly, then require
            // every trust-relevant field to match values GitHub attached to this event.
            let pr;
            try {
              const resp = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(rawNumber),
              });
              pr = resp.data;
            } catch (e) {
              core.setFailed(`Could not fetch PR #${rawNumber} via the API — refusing to trust the pr-metadata artifact: ${e.message}`);
              return;
            }

            const headRepo = context.payload.workflow_run.head_repository;
            const baseRepo = context.payload.workflow_run.repository;
            const headBranch = context.payload.workflow_run.head_branch;

            if (pr.state !== 'open') {
              core.setFailed(`PR #${rawNumber} is not open (state: ${pr.state}) — refusing to trust the pr-metadata artifact.`);
              return;
            }
            if (pr.draft) {
              core.setFailed(`PR #${rawNumber} is a draft — refusing to run live integration tests against it.`);
              return;
            }
            if (pr.head.sha !== trustedSha) {
              core.setFailed(`PR #${rawNumber}'s current head sha (${pr.head.sha}) does not match the trusted workflow_run head_sha (${trustedSha}) — PR head moved or artifact is stale/forged.`);
              return;
            }
            if (!pr.head.repo || pr.head.repo.full_name !== headRepo.full_name) {
              core.setFailed(`PR #${rawNumber}'s head repo (${pr.head.repo && pr.head.repo.full_name}) does not match the trusted workflow_run head_repository (${headRepo.full_name}) — refusing to trust the pr-metadata artifact.`);
              return;
            }
            if (pr.head.ref !== headBranch) {
              core.setFailed(`PR #${rawNumber}'s head branch (${pr.head.ref}) does not match the trusted workflow_run head_branch (${headBranch}) — refusing to trust the pr-metadata artifact.`);
              return;
            }
            if (pr.base.repo.full_name !== baseRepo.full_name) {
              core.setFailed(`PR #${rawNumber}'s base repo (${pr.base.repo.full_name}) is not this repository — refusing to trust the pr-metadata artifact.`);
              return;
            }

            core.setOutput('found', 'true');
            core.setOutput('number', String(pr.number));
            core.setOutput('sha', trustedSha);

      - name: Create pending check run
        id: create-check
        if: steps.pr.outputs.found == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_SHA: ${{ steps.pr.outputs.sha }}
        with:
          script: |
            // Capture the created check run's own ID as a job output rather than having
            // `report` re-look it up by ref+name later: a rerun of this workflow (or of
            // PR Metadata) for the same head SHA would create a second `integration-test`
            // check run, and listForRef().check_runs[0] has no guarantee of returning
            // *this* run's check — it could complete a different run's check and leave
            // this one stuck at queued.
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'integration-test',
              head_sha: process.env.PR_SHA,
              status: 'queued',
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.setOutput('id', String(check.id));

  integration-test:
    name: integration-test
    needs: resolve
    if: needs.resolve.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: integration-test # gate: waits for reviewer approval here
    concurrency:
      # One fixed group for every PR/branch, not keyed by head repo/branch: every run —
      # regardless of which fork or branch it came from — hits the same live org (sg0)
      # and provisions the same fixed-name resources (see integration_test.go TestMain,
      # and e.g. TestLiveCreateVariableV2ReturnsErrorOnDuplicateName, which asserts that
      # duplicate names are rejected). A per-branch key would let two approved PRs run
      # this job at the same time and collide on those names.
      #
      # Scoped to this job rather than the whole workflow so a second PR's `resolve` job
      # (validation + opening the queued check) still runs immediately and isn't stuck
      # behind however long the first PR's environment approval takes to arrive.
      group: integration-test-live-suite
      cancel-in-progress: false
    # Deliberately just contents: read — this job runs a fork PR's code with a live API
    # token in its environment. Reporting the outcome (checks:write, pull-requests:write)
    # is split into the ungated `report` job below so fork code never runs on a runner that
    # also holds write access to checks or PR comments.
    permissions:
      contents: read

    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Checkout by the exact commit SHA recorded by `resolve`, not refs/pull/<n>/head:
          # that ref is mutable and the environment approval above can sit for hours or
          # days, during which the PR could gain new, unreviewed commits.
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Verify checked-out SHA matches recorded PR head
        env:
          PR_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$PR_SHA" ]; then
            echo "Checked-out SHA ($actual) does not match PR metadata ($PR_SHA) — refusing to run privileged tests against an unexpected checkout." >&2
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'
          # No build cache here: workflow_run executes on the base repo's default-branch
          # ref, so a cache written in this job would be saved into the shared main cache
          # scope and later restored by trusted CI runs — a poisoning path for fork code
          # to persist beyond its own PR. Every other job that needs a fast Go setup runs
          # on ci.yml, which is unaffected by this.
          cache: false

      - name: Run live integration tests
        env:
          API_ACCESS_TOKEN: ${{ secrets.API_ACCESS_TOKEN }}
          REALM: ${{ secrets.REALM }}
        run: make test-integration

      - name: Upload integration test log
        # Always upload, even on failure, so the report job can render a result table
        # instead of just "the job failed". make test-integration already strips the
        # X-Sf-Token header line from this log before it's written.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-log
          path: integration.jsonl
          if-no-files-found: warn
          retention-days: 3

  # Ungated, and runs regardless of how integration-test ended — deliberately the only job
  # with checks:write/pull-requests:write, so those never coexist on a runner with fork
  # code. Also the counterpart to the sibling repo's separate finalize-on-incomplete job:
  # environment-approval rejection or timeout fails integration-test before any of its own
  # steps run (including an artifact upload), which this handles via needs.*.result rather
  # than requiring a second job to notice a check stuck at queued.
  report:
    name: report
    needs: [resolve, integration-test]
    if: always() && needs.resolve.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      checks: write
    steps:
      - name: Download integration test log
        id: download-log
        continue-on-error: true # absent when the job never started (rejected/timed-out approval)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: integration-test-log
          path: integration-test-log

      - name: Report check run result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          JOB_RESULT: ${{ needs.integration-test.result }}
          CHECK_RUN_ID: ${{ needs.resolve.outputs.check-run-id }}
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
        with:
          script: |
            const fs = require('fs');
            const conclusion = process.env.JOB_RESULT === 'success' ? 'success' : 'failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let table = '_No test output was captured — the job likely did not start (environment approval was rejected or timed out before the run began)._';
            const logPath = 'integration-test-log/integration.jsonl';
            if (fs.existsSync(logPath)) {
              const lines = fs.readFileSync(logPath, 'utf8').split('\n');
              const results = [];
              let buildFailed = false;
              for (const line of lines) {
                if (!line) continue;
                let event;
                try {
                  event = JSON.parse(line);
                } catch (e) {
                  continue;
                }
                if (event.Action === 'build-fail') buildFailed = true;
                // Only live integration tests (TestLive* — the convention every test in
                // integration_test.go follows) show up here; the table reports on those,
                // never on raw stdout/response bodies.
                if (event.Test && event.Test.startsWith('TestLive') && (event.Action === 'pass' || event.Action === 'fail' || event.Action === 'skip')) {
                  results.push(event);
                }
              }
              results.sort((a, b) => a.Test.localeCompare(b.Test));

              if (buildFailed) {
                table = '⚠️ Build failed before any tests ran — see the job log for compiler errors.';
              } else if (results.length === 0) {
                table = '⚠️ No live integration test (TestLive*) results were produced — see the job log for details.';
              } else {
                const passed = results.filter(r => r.Action === 'pass').length;
                const failed = results.filter(r => r.Action === 'fail').length;
                const skipped = results.filter(r => r.Action === 'skip').length;
                const icon = r => r.Action === 'pass' ? '✅ Pass' : r.Action === 'skip' ? '⚠️ Skip' : '❌ Fail';
                const rows = results.map(r => `| ${r.Test} | ${icon(r)} | ${r.Elapsed ?? 0} |`).join('\n');
                table = `**Live integration tests — Total:** ${results.length} | **Passed:** ${passed} | **Failed:** ${failed} | **Skipped:** ${skipped}\n\n` +
                  `| Test | Result | Duration (s) |\n|---|---|---|\n${rows}`;
              }
            }

            // Update the exact check run `resolve` created (its ID was threaded through as
            // a job output), not a re-lookup by ref+name: a rerun of this workflow for the
            // same head SHA would create a second `integration-test` check run, and
            // listForRef().check_runs[0] has no guarantee of returning *this* run's check —
            // it could complete a different run's check and leave this one stuck at queued.
            if (process.env.CHECK_RUN_ID) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: Number(process.env.CHECK_RUN_ID),
                status: 'completed',
                conclusion,
                details_url: runUrl,
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `### Integration Test: ${conclusion === 'success' ? '✅ Passed' : '❌ Failed'}\n\n[View run](${runUrl})\n\n${table}`,
            });
